name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          # The plugin harness imports TypeScript, which needs node 23.6+.
          node-version: "24"
      - name: Python suite
        run: python -m unittest discover -s tests -v
      - name: Plugin checks
        run: node tests/plugin_budget_test.mjs
